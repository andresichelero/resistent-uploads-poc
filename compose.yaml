name: resume-proof
services:
  app:
    build: .
    ports: ['127.0.0.1:3000:3000']
    environment:
      HOST: 0.0.0.0
      TUS_URL: http://tusd:8080
      S3_ENDPOINT: http://storage:8333
      S3_BUCKET: uploads
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local-demo
      AWS_SECRET_ACCESS_KEY: local-demo-only
      SCAN_REQUIRED: ${SCAN_REQUIRED:-false}
      CLAM_HOST: clamav
    volumes: ['records:/app/data']
    depends_on: [storage, tusd]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 30
  tusd:
    image: ghcr.io/tus/tusd:v2.10.1
    command:
      [
        '-s3-bucket=uploads',
        '-s3-endpoint=http://storage:8333',
        '-s3-part-size=8388608',
        '-s3-max-buffered-parts=2',
        '-s3-concurrent-part-uploads=2',
        '-max-size=104857600',
        '-disable-download',
        '-disable-concatenation',
        '-disable-cors',
        '-hooks-http=http://app:3001/hooks',
        '-hooks-enabled-events=pre-create,post-create,post-finish',
        '-network-timeout=15s',
        '-verbose=false',
      ]
    environment:
      AWS_ACCESS_KEY_ID: local-demo
      AWS_SECRET_ACCESS_KEY: local-demo-only
      AWS_REGION: us-east-1
    depends_on: [storage]
  storage:
    image: chrislusf/seaweedfs:4.47
    command: ['mini', '-dir=/data']
    environment:
      AWS_ACCESS_KEY_ID: local-demo
      AWS_SECRET_ACCESS_KEY: local-demo-only
      S3_BUCKET: uploads
    volumes: ['objects:/data']
  clamav:
    image: clamav/clamav:1.5.4
    profiles: ['antivirus']
    volumes: ['signatures:/var/lib/clamav', './infra/clamd.conf:/etc/clamav/clamd.conf:ro']
    mem_limit: 4g
    healthcheck:
      test: ['CMD', 'clamdscan', '--config-file=/etc/clamav/clamd.conf', '--ping', '1']
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 30s
volumes:
  records:
  objects:
  signatures:
